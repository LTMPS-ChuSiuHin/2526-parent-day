<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>25-26 期終家長日面見提示系統</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
            --card-free-grad: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --card-busy-grad: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            --card-break-grad: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            --text-dark: #1e293b;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-gradient); min-height: 100vh; margin: 0; padding: 20px;
            color: var(--text-dark); -webkit-tap-highlight-color: transparent;
        }

        h1 { text-align: center; font-size: 2.4em; margin-bottom: 20px; color: #0f172a; font-weight: 800; }

        .nav-tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
        .nav-btn {
            background-color: #fff; border: 2px solid #cbd5e1; padding: 12px 20px; font-size: 1.05em;
            font-weight: 700; border-radius: 40px; cursor: pointer; color: #475569; transition: all 0.2s; box-shadow: var(--shadow-sm);
        }
        .nav-btn:active { transform: scale(0.95); }
        .nav-btn.active { background-color: #2563eb; color: #fff; border-color: #2563eb; box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3); }

        .view-section { display: none; max-width: 1400px; margin: 0 auto; }
        .view-section.active { display: block; animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 24px; }

        .floor-tabs { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 2px dashed #cbd5e1; }
        .floor-btn { background-color: #f8fafc; border: 2px solid #cbd5e1; padding: 12px 24px; border-radius: 16px; cursor: pointer; font-weight: 700; font-size: 1.1em; color: #475569; }
        .floor-btn.active { background-color: #0f172a; color: #fff; border-color: #0f172a; }

        /* 登記處專屬網格排版 (1行3班，共顯示6班為2行) */
        #admin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        @media (max-width: 1024px) { #admin-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 768px) { #admin-grid { grid-template-columns: 1fr; } }

        .admin-card { background-color: #fff; border-radius: 20px; padding: 20px; box-shadow: var(--shadow-md); border: 1px solid #e2e8f0; display: flex; flex-direction: column;}
        .a-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f1f5f9; padding-bottom: 12px; margin-bottom: 10px; flex-wrap: wrap; gap: 10px;}
        .a-class-name { font-size: 2em; font-weight: 800; color: #334155; }
        
        .btn-undo { background: #f1f5f9; color: #64748b; border: 1px solid #cbd5e1; padding: 6px 14px; border-radius: 12px; font-size: 0.9em; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .btn-undo:hover:not(:disabled) { background: #e2e8f0; color: #0f172a; }
        .btn-undo:disabled { opacity: 0.4; cursor: not-allowed; }

        .status-pill { padding: 6px 16px; border-radius: 30px; font-weight: 800; font-size: 1em; color: white;}
        .pill-free { background-color: #10b981; }
        .pill-busy { background-color: #ef4444; }
        .pill-break { background-color: #f59e0b; } 

        .student-list { flex-grow: 1; overflow-y: auto; padding-right: 10px; margin-top: 10px; -webkit-overflow-scrolling: touch; }
        .student-list::-webkit-scrollbar { width: 6px; }
        .student-list::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }

        #admin-grid .student-list { height: 310px; max-height: 310px; overflow-y: auto; }

        .student-row {
            display: flex; justify-content: space-between; align-items: center; padding: 14px 16px;
            margin-bottom: 10px; border-radius: 14px; cursor: pointer; font-weight: 700; font-size: 1.05em;
            border: 2px solid transparent; user-select: none; transition: transform 0.1s;
        }
        .student-row:active { transform: scale(0.97); }
        .s-pending { background-color: #f8fafc; border-color: #e2e8f0; color: #64748b; }
        .s-registered { background-color: #fffbeb; border-color: #fde68a; color: #d97706; }
        .s-registered::after { content: '⏳ 已登記'; font-size: 0.85em; background: #fef3c7; padding: 4px 10px; border-radius: 12px; }
        .s-interviewing { background-color: #fee2e2; border-color: #fca5a5; color: #991b1b; }
        .s-interviewing::after { content: '🔴 面見中'; font-size: 0.85em; background: #fecaca; padding: 4px 10px; border-radius: 12px; }
        .s-finished { background-color: #f0fdf4; border-color: #bbf7d0; color: #166534; opacity: 0.6; text-decoration: line-through; }
        .s-finished::after { content: '✔️ 完成'; font-size: 0.85em; text-decoration: none; display: inline-block; }

        /* 更新：取消「已鎖定」字眼 */
        .is-next-inline { border: 2px solid #3b82f6 !important; background-color: #eff6ff; position: relative; }
        .is-next-inline::before { content: '🔜 下一位'; position: absolute; left: -10px; top: -12px; background: #3b82f6; color: white; font-size: 0.75em; padding: 4px 10px; border-radius: 10px; box-shadow: var(--shadow-sm); }

        /* 等候室資訊面板 */
        .waiting-info-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; }
        @media (max-width: 1000px) { .waiting-info-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 650px) { .waiting-info-grid { grid-template-columns: 1fr; } }
        .info-card { background: #fff; border-radius: 24px; padding: 25px; box-shadow: var(--shadow-md); border-top: 8px solid #cbd5e1; text-align: center; }
        .info-card.busy { border-top-color: #ef4444; }
        .info-card.free { border-top-color: #10b981; }
        .info-card.break { border-top-color: #f59e0b; }
        .i-class { font-size: 2.5em; font-weight: 900; color: #1e293b; margin-bottom: 10px; }
        .i-current { font-size: 1.3em; color: #475569; margin-bottom: 15px; min-height: 35px; }
        .i-next-box { background: #eff6ff; border: 2px dashed #bfdbfe; border-radius: 16px; padding: 15px; margin-top: 15px; }
        .i-next-title { font-size: 1em; color: #3b82f6; font-weight: bold; margin-bottom: 5px; }
        .i-next-name { font-size: 1.8em; font-weight: 800; color: #1e3a8a; }

        /* 班主任面版：靈活的 Flexbox 雙欄佈局 */
        .teacher-setup { background: #fff; max-width: 500px; margin: 40px auto; padding: 40px; border-radius: 24px; box-shadow: var(--shadow-lg); text-align: center; }
        .teacher-setup select { width: 100%; padding: 16px; margin-bottom: 25px; font-size: 1.3em; border-radius: 16px; border: 2px solid #cbd5e1; }
        .btn-primary { background: #0f172a; color: white; width: 100%; padding: 18px; font-size: 1.3em; font-weight: bold; border-radius: 16px; border: none; cursor: pointer; }
        
        .teacher-panel-layout {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
            align-items: flex-start;
        }
        .teacher-left-col { flex: 1 1 350px; min-width: 300px; }
        .teacher-right-col { flex: 1.5 1 400px; min-width: 350px; }
        
        .single-teacher-panel { display: none; }
        .single-teacher-panel.active { display: block; animation: fadeIn 0.4s ease; }
        
        .teacher-card {
            aspect-ratio: 1 / 1; border-radius: 36px; color: white; padding: 25px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            box-shadow: var(--shadow-lg); position: relative; margin-bottom: 20px; transition: all 0.3s;
            cursor: default; 
        }
        .teacher-card.free { background: var(--card-free-grad); }
        .teacher-card.busy { background: var(--card-busy-grad); }
        .teacher-card.break { background: var(--card-break-grad); }
        
        .t-class-name { font-size: 4.5em; font-weight: 900; margin: 0; text-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .t-timer { font-size: 3.5em; font-weight: bold; font-family: monospace; text-shadow: 0 2px 5px rgba(0,0,0,0.2); margin: 10px 0;}
        .t-student-info { font-size: 1.6em; font-weight: 800; background: #fff; color: #dc2626; padding: 10px 25px; border-radius: 20px; margin-top: 5px; box-shadow: var(--shadow-sm); text-align: center; }
        
        .teacher-actions-container {
            background: #fff; padding: 20px; border-radius: 24px; box-shadow: var(--shadow-md); 
            display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px;
        }
        .btn-t-action { padding: 16px 24px; border-radius: 16px; font-size: 1.2em; font-weight: bold; cursor: pointer; border: none; width: 100%; transition: opacity 0.2s; }
        .btn-t-action:hover { opacity: 0.85; }
        .btn-t-main { background: #fee2e2; color: #991b1b; border: 2px solid #fca5a5; }
        .btn-t-break { background: #fef08a; color: #854d0e; border: 2px solid #fde047; }
        .btn-t-feedback { background: #e0f2fe; color: #0369a1; border: 2px solid #bae6fd; }
        
        .teacher-readonly-list {
            background: #fff; border-radius: 24px; padding: 20px; box-shadow: var(--shadow-md); 
            display: flex; flex-direction: column; max-height: 750px;
        }

        .btn-back { background: transparent; border: 2px solid #94a3b8; color: #64748b; padding: 12px 24px; border-radius: 20px; font-weight: bold; font-size: 1.1em; cursor: pointer; }

        /* 編排頁面 (Setup Editor) */
        .setup-card { background: #fff; border-radius: 20px; padding: 30px; box-shadow: var(--shadow-md); margin-bottom: 20px; overflow-x: auto; }
        
        .auto-schedule-box {
            background: #f8fafc; padding: 15px 20px; border-radius: 16px; border: 2px dashed #cbd5e1; margin-bottom: 20px;
            display: flex; flex-wrap: wrap; gap: 15px; align-items: center;
        }
        .auto-input { padding: 8px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 1.1em; width: 60px; text-align: center;}
        
        .editor-table { width: 100%; border-collapse: collapse; margin-top: 5px; min-width: 600px;}
        .editor-table th { background: #f1f5f9; padding: 12px; text-align: left; font-size: 1.1em; color: #334155; border-radius: 8px;}
        .editor-table td { padding: 8px; border-bottom: 1px solid #e2e8f0; background: #fff;}
        .editor-table input { padding: 12px; border-radius: 10px; border: 2px solid #cbd5e1; font-size: 1.1em; width: 100%; box-sizing: border-box; }
        
        .editor-table tr { transition: background 0.2s; }
        .editor-table tr.dragging { opacity: 0.5; background: #e2e8f0 !important; box-shadow: inset 0 0 10px rgba(0,0,0,0.1); }
        .drag-handle { cursor: grab; text-align: center; color: #94a3b8; font-size: 1.8em; user-select: none; width: 40px; }
        .drag-handle:active { cursor: grabbing; }

        .btn-delete-row { background: #fee2e2; color: #ef4444; border: none; padding: 12px 16px; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%;}

        /* 意見查閱列表 */
        .feedback-card { background: #fff; border-radius: 20px; padding: 20px; box-shadow: var(--shadow-sm); border: 1px solid #e2e8f0; border-left: 6px solid #3b82f6; display: flex; flex-direction: column; gap: 10px; }
        .fb-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #cbd5e1; padding-bottom: 10px; }
        .fb-class { font-size: 1.3em; font-weight: 800; color: #1e3a8a; background: #eff6ff; padding: 4px 12px; border-radius: 10px;}
        .fb-time { font-size: 0.9em; color: #64748b; }
        .fb-student { font-size: 1.1em; font-weight: 700; color: #0f172a; margin-top: 5px;}
        .fb-content { font-size: 1.1em; color: #334155; background: #f8fafc; padding: 15px; border-radius: 12px; white-space: pre-wrap; line-height: 1.5;}
        .fb-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
        .btn-fb-edit { background: #e0f2fe; color: #0369a1; border: none; padding: 6px 16px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .btn-fb-delete { background: #fee2e2; color: #b11c1c; border: none; padding: 6px 16px; border-radius: 10px; font-weight: bold; cursor: pointer; }

        /* Modal 優化版 */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; animation: fadeIn 0.2s; }
        .modal-content { background: #fff; padding: 30px; border-radius: 24px; width: 90%; max-width: 500px; box-shadow: var(--shadow-lg); text-align: left; }
        .modal-content h3 { margin-top: 0; font-size: 1.5em; text-align: center; }
        .modal-content textarea { width: 100%; height: 150px; padding: 15px; border-radius: 12px; border: 2px solid #cbd5e1; font-size: 1.1em; margin-bottom: 20px; resize: none; box-sizing: border-box; }
        .modal-btns { display: flex; justify-content: flex-end; gap: 10px; }
    </style>

    <!-- 載入 Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, updateDoc, deleteDoc, collection, onSnapshot, addDoc, serverTimestamp, writeBatch, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAL3coGmBnIRATzeTXGrTfoybIPoFAN2jw",
            authDomain: "ltmps-admin.firebaseapp.com",
            projectId: "ltmps-admin",
            storageBucket: "ltmps-admin.firebasestorage.app",
            messagingSenderId: "856697746872",
            appId: "1:856697746872:web:2d722703b3cf4fab420b4d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let systemData = {};
        let feedbackData = []; 
        let currentFloor = '一樓 XSpace'; 
        let myClass = null; 
        let editingFeedbackId = null; 
        let editingFeedbackClass = null; // 用於儲存當前正在編輯意見的班級
        
        const floorMap = {
            '一樓 XSpace': ['1A', '1B', '1C', '1D', '1E', '2A'],
            '二樓 InnoSpace': ['2B', '2C', '2D', '2E', '3A', '3B'],
            '四樓 音樂室': ['3C', '3D', '3E', '4A', '4B', '4C'],
            '五樓 音樂室': ['4D', '4E', '5A', '5B', '5C', '5D'],
            '6E 課室': ['5E']
        };
        const classList = Object.values(floorMap).flat();

        onSnapshot(collection(db, "classes"), (snapshot) => {
            snapshot.docs.forEach(doc => { systemData[doc.id] = doc.data(); });
            renderAll();
        });

        const qFeedback = query(collection(db, "feedbacks"), orderBy("timestamp", "desc"));
        onSnapshot(qFeedback, (snapshot) => {
            feedbackData = [];
            snapshot.docs.forEach(doc => { feedbackData.push({ id: doc.id, ...doc.data() }); });
            if (document.getElementById('view-feedback-list').classList.contains('active')) {
                renderFeedbackList();
            }
        });

        async function updateFirebase(className, newData) {
            try { await setDoc(doc(db, "classes", className), newData, { merge: true }); } 
            catch (error) { console.error(error); alert("網路錯誤，資料更新失敗！"); }
        }

        function saveSnapshot(room) {
            const snap = JSON.parse(JSON.stringify(room));
            delete snap.historySnapshot;
            room.historySnapshot = snap;
        }

        function updateLockedNextStudent(room) {
            if (!room.schedule) return;
            const registered = room.schedule.filter(s => s.state === 'registered');
            if (registered.length === 0) { room.lockedNextClassNo = null; return; }
            if (room.lockedNextClassNo) {
                const stillValid = registered.find(s => s.classNo === room.lockedNextClassNo);
                if (stillValid) return; 
            }
            const tempSorted = [...registered].sort((a, b) => a.time.localeCompare(b.time));
            room.lockedNextClassNo = tempSorted[0].classNo;
        }

        function getLockedNextStudentObj(room) {
            if (!room || !room.lockedNextClassNo || !room.schedule) return null;
            return room.schedule.find(s => s.classNo === room.lockedNextClassNo) || null;
        }

        // =======================
        // UI 切換及全局功能
        // =======================
        window.switchView = function(viewName) {
            if (viewName === 'feedback-list') {
                const pwd = prompt("請輸入管理員密碼以查閱意見：");
                if (pwd !== "ltmps") { alert("密碼錯誤，拒絕存取。"); return; }
            }

            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(`view-${viewName}`).classList.add('active');
            document.getElementById(`btn-tab-${viewName}`).classList.add('active');
            
            if(viewName === 'setup') window.loadScheduleEditor();
            if(viewName === 'feedback-list') renderFeedbackList();
            renderAll();
        }

        window.switchFloor = function(floorName) { currentFloor = floorName; renderAll(); }

        window.advanceStudentState = function(className, classNo) {
            let room = systemData[className] || { status: 'free', schedule: [] };
            let student = room.schedule.find(s => s.classNo === classNo);

            if (student.state === 'registered' && room.status === 'break') {
                alert("老師正在小休，暫時不能安排面見！\n請等待老師狀態改為「空閒中」。");
                return;
            }

            if (student.state === 'registered' && room.status === 'busy') {
                alert("課室正在面見中！\n等候室不能安排下一位家長，請等待老師結束當前面見轉為「空閒中」。");
                return;
            }

            if (student.state === 'interviewing') {
                alert("等候室不能結束面見！\n必須由老師於「班主任面見面版」點擊結束。");
                return;
            }

            saveSnapshot(room);

            if (student.state === 'pending') { student.state = 'registered'; } 
            else if (student.state === 'registered') {
                let current = room.schedule.find(s => s.state === 'interviewing');
                if (current) current.state = 'finished';
                student.state = 'interviewing';
                room.status = 'busy'; room.startTime = Date.now();
                room.currentStudent = { name: student.name, classNo: student.classNo };
            } 
            
            updateLockedNextStudent(room);
            updateFirebase(className, room);
        }

        window.undoLastAction = function(className) {
            let room = systemData[className];
            if (room && room.historySnapshot) {
                updateFirebase(className, room.historySnapshot).then(() => {
                    updateFirebase(className, { historySnapshot: null });
                });
            }
        }

        // === 班主任面板邏輯 ===
        window.enterTeacherPanel = function() {
            myClass = `${document.getElementById('select-grade').value}${document.getElementById('select-class').value}`;
            document.getElementById('teacher-setup').style.display = 'none';
            document.getElementById('teacher-panel-view').classList.add('active');
            renderAll();
        }
        window.exitTeacherPanel = function() {
            myClass = null;
            document.getElementById('teacher-setup').style.display = 'block';
            document.getElementById('teacher-panel-view').classList.remove('active');
        }

        window.toggleTeacherStatus = function() {
            if (!myClass) return;
            let room = systemData[myClass] || { status: 'free', schedule: [] };
            saveSnapshot(room);

            if (room.status === 'busy') {
                room.status = 'free'; room.startTime = null;
                if (room.currentStudent) {
                    let current = room.schedule.find(s => s.state === 'interviewing');
                    if (current) current.state = 'finished';
                }
                room.currentStudent = null;
                updateLockedNextStudent(room);
                updateFirebase(myClass, room);
            }
        }

        window.setBreakStatus = function() {
            if (!myClass) return;
            let room = systemData[myClass];
            saveSnapshot(room);
            if(room.status === 'busy') return alert("請先結束當前面見，再切換小休。");
            room.status = room.status === 'break' ? 'free' : 'break';
            room.startTime = null; 
            updateFirebase(myClass, room);
        }

        // =======================
        // 意見 Modal 邏輯 (全新下拉選單設計)
        // =======================
        window.openFeedbackModal = function() {
            if (!myClass || !systemData[myClass]) return;
            editingFeedbackClass = myClass;
            let room = systemData[myClass];
            
            // 決定預設學生 (正在面見 或 最後完成)
            let defaultStudent = room.currentStudent; 
            if(!defaultStudent) {
                let finished = (room.schedule || []).filter(s => s.state === 'finished');
                if(finished.length > 0) defaultStudent = finished[finished.length - 1];
            }

            // 建立選項
            let selectHtml = `<option value="N/A" data-name="N/A">一般班級備註 (目前無特定對象)</option>`;
            let sortedSchedule = [...(room.schedule || [])].sort((a,b) => parseInt(a.classNo || 0) - parseInt(b.classNo || 0));
            
            sortedSchedule.forEach(stu => {
                let selected = (defaultStudent && defaultStudent.classNo === stu.classNo) ? "selected" : "";
                selectHtml += `<option value="${stu.classNo}" data-name="${stu.name}" ${selected}>${stu.classNo}號 ${stu.name}</option>`;
            });

            document.getElementById('feedback-student-select').innerHTML = selectHtml;
            document.getElementById('feedback-modal').classList.add('active');
            document.getElementById('feedback-text').value = '';
        }

        window.closeFeedbackModal = function() { 
            document.getElementById('feedback-modal').classList.remove('active'); 
            editingFeedbackId = null; 
        }

        window.submitFeedback = async function() {
            const text = document.getElementById('feedback-text').value;
            if(!text.trim()) return alert("請輸入意見內容");

            const selectEl = document.getElementById('feedback-student-select');
            const selectedOption = selectEl.options[selectEl.selectedIndex];
            const classNo = selectedOption.value;
            const studentName = selectedOption.getAttribute('data-name');
            const targetClass = editingFeedbackClass || myClass;

            try {
                if (editingFeedbackId) {
                    await updateDoc(doc(db, "feedbacks", editingFeedbackId), { content: text, classNo: classNo, studentName: studentName });
                    alert("✅ 意見已成功更新！");
                } else {
                    await addDoc(collection(db, "feedbacks"), {
                        className: targetClass,
                        studentName: studentName,
                        classNo: classNo,
                        content: text,
                        timestamp: serverTimestamp()
                    });
                    alert("✅ 意見已成功儲存至 Firebase 雲端！");
                }
                closeFeedbackModal();
            } catch (e) { alert("上傳失敗，請檢查網絡連線。"); }
        }

        window.editFeedback = function(id, content, fClass, fClassNo) {
            editingFeedbackId = id;
            editingFeedbackClass = fClass;

            let selectHtml = `<option value="N/A" data-name="N/A">一般班級備註 (目前無特定對象)</option>`;
            if (systemData[fClass] && systemData[fClass].schedule) {
                 let sortedSchedule = [...systemData[fClass].schedule].sort((a,b) => parseInt(a.classNo || 0) - parseInt(b.classNo || 0));
                 sortedSchedule.forEach(stu => {
                     let selected = (fClassNo === stu.classNo) ? "selected" : "";
                     selectHtml += `<option value="${stu.classNo}" data-name="${stu.name}" ${selected}>${stu.classNo}號 ${stu.name}</option>`;
                 });
            } else {
                 selectHtml += `<option value="${fClassNo}" data-name="N/A" selected>${fClassNo}號</option>`;
            }
            
            document.getElementById('feedback-student-select').innerHTML = selectHtml;
            document.getElementById('feedback-text').value = content;
            document.getElementById('feedback-modal').classList.add('active');
        }

        window.deleteFeedback = async function(id) {
            if(confirm("確定要永久刪除這筆意見紀錄嗎？")) {
                try { await deleteDoc(doc(db, "feedbacks", id)); alert("✅ 已刪除"); } 
                catch(e) { alert("刪除失敗"); }
            }
        }

        window.resetDayStatus = async function() {
            const pwd = prompt("請輸入管理員密碼以進行安全重設：");
            if (pwd !== "ltmps") { alert("密碼錯誤，拒絕重設。"); return; }
            if (!confirm('⚠️ 警告：這會將全校的面見狀態及進度重置為「未到達/空閒」。\n確定執行？')) return;
            
            const batch = writeBatch(db);
            classList.forEach(className => {
                let room = systemData[className] || { schedule: [] };
                let newSchedule = (room.schedule || []).map(s => ({...s, state: 'pending'}));
                const ref = doc(db, 'classes', className);
                batch.set(ref, {
                    status: 'free', startTime: null, currentStudent: null, lockedNextClassNo: null, historySnapshot: null, schedule: newSchedule
                }, { merge: true });
            });
            try { await batch.commit(); alert('✅ 面見進度重置成功！'); } 
            catch (e) { alert('重置失敗，請檢查網絡。'); }
        }

        // =======================
        // 動態表格編輯器 (排序、拖曳、自動安排時間)
        // =======================
        window.loadScheduleEditor = function() {
            const editClass = document.getElementById('edit-class-select').value;
            const container = document.getElementById('editor-table-container');
            let room = systemData[editClass] || { schedule: [] };
            let schedule = room.schedule || [];
            
            let html = `
                <table class="editor-table">
                    <thead><tr><th style="width:40px;">順序</th><th style="width:15%;">學號</th><th style="width:30%;">學生姓名</th><th style="width:25%;">預約時間</th><th style="width:20%;">操作</th></tr></thead>
                    <tbody id="schedule-tbody">
            `;
            if (schedule.length === 0) { html += generateRowHTML("", "", "09:00", "pending"); } 
            else { schedule.forEach(stu => { html += generateRowHTML(stu.classNo, stu.name, stu.time, stu.state); }); }
            html += `</tbody></table>`;
            container.innerHTML = html;
            
            initDragAndDrop(); 
        }

        function generateRowHTML(no, name, time, state) {
            return `<tr draggable="true">
                <td class="drag-handle" title="按住拖曳以改變次序">&#9776;</td>
                <td><input type="number" class="input-no" value="${no}" placeholder="例: 1"></td>
                <td><input type="text" class="input-name" value="${name}" placeholder="請輸入姓名"></td>
                <td><input type="time" class="input-time" value="${time}"></td>
                <td>
                    <button class="btn-delete-row" onclick="this.closest('tr').remove()">🗑️ 刪除</button>
                    <input type="hidden" class="input-state" value="${state}">
                </td>
            </tr>`;
        }

        window.addNewStudentRow = function() {
            const tbody = document.getElementById('schedule-tbody');
            if(tbody) tbody.insertAdjacentHTML('beforeend', generateRowHTML("", "", "09:00", "pending"));
        }

        window.sortEditor = function(type) {
            const tbody = document.getElementById('schedule-tbody');
            if(!tbody) return;
            let rows = Array.from(tbody.querySelectorAll('tr'));
            rows.sort((a, b) => {
                if(type === 'classNo') {
                    let valA = parseInt(a.querySelector('.input-no').value) || 0;
                    let valB = parseInt(b.querySelector('.input-no').value) || 0;
                    return valA - valB;
                } else if (type === 'time') {
                    let valA = a.querySelector('.input-time').value || "";
                    let valB = b.querySelector('.input-time').value || "";
                    return valA.localeCompare(valB);
                }
            });
            rows.forEach(row => tbody.appendChild(row));
        }

        window.applyAutoSchedule = function() {
            const startTime = document.getElementById('auto-start-time').value; 
            const duration = parseInt(document.getElementById('auto-duration').value) || 10;
            const bufferCount = parseInt(document.getElementById('auto-buffer-count').value) || 5;
            const bufferTime = parseInt(document.getElementById('auto-buffer-time').value) || 15;

            if (!startTime) return alert("請輸入首位時間！");

            let [hours, mins] = startTime.split(':').map(Number);
            let currentTime = new Date(2000, 0, 1, hours, mins); 

            const rows = document.querySelectorAll('#schedule-tbody tr');
            let studentCount = 0;

            rows.forEach((row, index) => {
                if (studentCount > 0 && studentCount % bufferCount === 0) {
                    currentTime.setMinutes(currentTime.getMinutes() + bufferTime);
                }

                let h = String(currentTime.getHours()).padStart(2, '0');
                let m = String(currentTime.getMinutes()).padStart(2, '0');
                row.querySelector('.input-time').value = `${h}:${m}`;

                currentTime.setMinutes(currentTime.getMinutes() + duration);
                studentCount++;
            });
            alert("✅ 自動排程已套用至畫面上，請檢查確認後，點擊最下方「儲存此班名單至雲端」。");
        }

        function initDragAndDrop() {
            const tbody = document.getElementById('schedule-tbody');
            if (!tbody) return;
            let draggedRow = null;

            tbody.addEventListener('dragstart', function (e) {
                draggedRow = e.target.closest('tr');
                if (draggedRow) setTimeout(() => draggedRow.classList.add('dragging'), 0);
            });

            tbody.addEventListener('dragend', function (e) {
                if (draggedRow) { draggedRow.classList.remove('dragging'); draggedRow = null; }
            });

            tbody.addEventListener('dragover', function (e) {
                e.preventDefault(); 
                const afterElement = getDragAfterElement(tbody, e.clientY);
                const tr = e.target.closest('tr');
                if (draggedRow && tr && draggedRow !== tr) {
                    if (afterElement == null) tbody.appendChild(draggedRow);
                    else tbody.insertBefore(draggedRow, afterElement);
                }
            });
        }

        function getDragAfterElement(container, y) {
            const draggableElements = [...container.querySelectorAll('tr:not(.dragging)')];
            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) return { offset: offset, element: child };
                else return closest;
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        window.saveClassData = async function() {
            const editClass = document.getElementById('edit-class-select').value;
            const rows = document.getElementById('schedule-tbody').querySelectorAll('tr');
            let newSchedule = [];
            rows.forEach(row => {
                const no = row.querySelector('.input-no').value.trim();
                const name = row.querySelector('.input-name').value.trim();
                const time = row.querySelector('.input-time').value.trim();
                const state = row.querySelector('.input-state').value;
                if (no !== "" && name !== "") newSchedule.push({ classNo: no, name: name, time: time || "09:00", state: state });
            });
            let currentRoomData = systemData[editClass] || { status: 'free', startTime: null, currentStudent: null, lockedNextClassNo: null };
            currentRoomData.schedule = newSchedule;
            try { await updateFirebase(editClass, currentRoomData); alert(`✅ ${editClass} 班名單及順序儲存成功！`); } 
            catch(e) { alert("儲存失敗！"); }
        }


        // =======================
        // 渲染介面
        // =======================
        function renderAll() {
            renderFloorTabs('floor-tabs-container'); renderFloorTabs('floor-tabs-container-info');
            renderAdminGrid(); renderInfoGrid(); renderMasterGrid();
            if (myClass) renderSingleTeacherPanel();
            updateTimersUI(); 
        }

        function renderFloorTabs(containerId) {
            const container = document.getElementById(containerId);
            if(!container) return;
            container.innerHTML = '';
            Object.keys(floorMap).forEach(floor => {
                const btn = document.createElement('button');
                btn.className = `floor-btn ${floor === currentFloor ? 'active' : ''}`;
                btn.innerText = floor;
                btn.onclick = () => switchFloor(floor);
                container.appendChild(btn);
            });
        }

        function getStatusText(status) {
            if(status === 'busy') return '🔴 面見中';
            if(status === 'break') return '🟡 小休中';
            return '🟢 空閒中';
        }
        function getStatusPillClass(status) {
            if(status === 'busy') return 'pill-busy';
            if(status === 'break') return 'pill-break';
            return 'pill-free';
        }

        function renderAdminGrid() {
            const grid = document.getElementById('admin-grid');
            if (!grid) return; 

            const scrollPositions = {};
            grid.querySelectorAll('.student-list').forEach(list => {
                const cls = list.getAttribute('data-class');
                if (cls) scrollPositions[cls] = list.scrollTop;
            });

            grid.innerHTML = '';
            floorMap[currentFloor].forEach((className) => {
                const room = systemData[className] || { status: 'free', schedule: [] };
                const lockedNext = getLockedNextStudentObj(room);
                const card = document.createElement('div');
                card.className = 'admin-card';

                let scheduleHTML = `<div class="student-list" data-class="${className}">`;
                if (!room.schedule || room.schedule.length === 0) { 
                    scheduleHTML += `<div style="text-align:center; padding: 20px; color: #94a3b8;">此班尚未建立名單</div>`; 
                } 
                else {
                    room.schedule.forEach(stu => {
                        let isNextClass = (lockedNext && lockedNext.classNo === stu.classNo) ? 'is-next-inline' : '';
                        scheduleHTML += `<div class="student-row s-${stu.state} ${isNextClass}" onclick="advanceStudentState('${className}', '${stu.classNo}')">
                                <span>🕒 ${stu.time} | ${stu.classNo}號 ${stu.name}</span></div>`;
                    });
                }
                scheduleHTML += `</div>`;

                card.innerHTML = `
                    <div class="a-header">
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <div class="a-class-name">${className}</div>
                            <div class="status-pill ${getStatusPillClass(room.status)}">${getStatusText(room.status)}</div>
                        </div>
                        <button class="btn-undo" onclick="undoLastAction('${className}')" ${!room.historySnapshot ? 'disabled' : ''}>↩️ 復原</button>
                    </div>${scheduleHTML}`;
                grid.appendChild(card);
            });

            grid.querySelectorAll('.student-list').forEach(list => {
                const cls = list.getAttribute('data-class');
                if (cls && scrollPositions[cls] !== undefined) {
                    list.scrollTop = scrollPositions[cls];
                }
            });
        }

        function renderInfoGrid() {
            const grid = document.getElementById('info-grid');
            if (!grid) return; grid.innerHTML = '';
            floorMap[currentFloor].forEach((className) => {
                const room = systemData[className] || { status: 'free', schedule: [] };
                const lockedNext = getLockedNextStudentObj(room);
                const currentName = room.currentStudent ? `${room.currentStudent.classNo}號 ${room.currentStudent.name}` : '無';
                
                // 等候室大螢幕：取消預約面見時間顯示，只保留學號與姓名
                const nextName = lockedNext ? `${lockedNext.classNo}號 ${lockedNext.name}` : '目前無人等候';
                
                let curStatusHtml = room.status === 'break' ? '🟡 老師稍事休息，請稍候' : (room.status === 'free' ? '🟢 目前空閒，準備叫號' : `🔴 面見中：<strong>${currentName}</strong>`);
                const card = document.createElement('div'); card.className = `info-card ${room.status}`;
                card.innerHTML = `<div class="i-class">${className} 班</div><div class="i-current">${curStatusHtml}</div>
                    <div class="i-next-box"><div class="i-next-title">🔜 下位面見家長</div><div class="i-next-name">${nextName}</div></div>`;
                grid.appendChild(card);
            });
        }

        function renderMasterGrid() {
            const grid = document.getElementById('master-grid');
            if (!grid) return; grid.innerHTML = '';
            classList.forEach((className) => {
                const room = systemData[className] || { status: 'free', schedule: [] };
                const waitingCount = (room.schedule || []).filter(s => s.state === 'registered').length;
                
                const card = document.createElement('div'); card.className = 'admin-card';
                card.style.borderTop = `6px solid ${room.status === 'busy' ? '#ef4444' : (room.status === 'break' ? '#f59e0b' : '#10b981')}`;
                card.innerHTML = `<div style="font-size:1.8em; font-weight:bold;">${className}</div>
                    <div style="font-size: 1.1em; color: #475569; margin-top: 5px;">等候人數: <strong style="color: #f59e0b; font-size: 1.3em;">${waitingCount}</strong></div>
                    <div class="timer-display" data-class="${className}" style="font-size:2em; font-weight:bold; font-family:monospace; margin:10px 0; color: #333">00:00</div>
                    <div style="font-size:1em; color:#475569; font-weight:bold;">${getStatusText(room.status)}</div>`;
                grid.appendChild(card);
            });
        }

        // === 班主任面板 (左右佈局 + 右側檢視清單) ===
        function renderSingleTeacherPanel() {
            if (!myClass) return;
            const room = systemData[myClass] || { status: 'free', schedule: [] };
            const lockedNext = getLockedNextStudentObj(room);
            const card = document.getElementById('single-teacher-card');
            const extraControls = document.getElementById('teacher-extra-controls');
            
            let studentInfoHTML = '';
            if (room.status === 'busy' && room.currentStudent) {
                studentInfoHTML = `<div class="t-student-info">正在面見：${room.currentStudent.classNo}號 ${room.currentStudent.name}</div>`;
            } else if (room.status === 'break') {
                studentInfoHTML = `<div class="t-student-info" style="color:#854d0e; background: #fef3c7;">☕ 小休狀態中</div>`;
            }

            // 班主任面板：取消「已鎖定」字眼
            let nextInfo = lockedNext ? `🔜 下一位：${lockedNext.time} (${lockedNext.classNo}號 ${lockedNext.name})` : `目前無人登記等候`;
            
            let centerText = '';
            if (room.status === 'free') centerText = '🟢 空閒中 (等待登記處安排入內)';
            else if (room.status === 'busy') centerText = '🔴 面見中 (請在下方按結束)';
            else if (room.status === 'break') centerText = '🟡 小休中 (請點擊下方結束小休)';

            card.className = `teacher-card ${room.status}`;
            card.innerHTML = `
                <div style="font-size: 1.3em; font-weight: bold; background: rgba(0,0,0,0.15); padding: 8px 16px; border-radius: 15px; margin-bottom: 20px;">
                    ${nextInfo}
                </div>
                <div class="t-class-name">${myClass}</div>
                <div class="t-timer timer-display" data-class="${myClass}">00:00</div>
                ${studentInfoHTML}
                <div style="font-size: 1.2em; font-weight: 700; margin-top: 15px; background: rgba(255,255,255,0.25); padding: 8px 20px; border-radius: 50px;">
                    ${centerText}
                </div>
            `;

            let actionsHtml = '';
            if (room.status === 'free') {
                actionsHtml = `
                    <button class="btn-t-action btn-t-break" onclick="setBreakStatus()">☕ 切換為小休</button>
                    <button class="btn-t-action btn-t-feedback" onclick="openFeedbackModal()">📝 填寫意見</button>
                `;
            } else if (room.status === 'busy') {
                actionsHtml = `
                    <button class="btn-t-action btn-t-main" onclick="toggleTeacherStatus()">🟢 結束本次面見</button>
                    <button class="btn-t-action btn-t-feedback" onclick="openFeedbackModal()">📝 填寫目前家長意見</button>
                `;
            } else if (room.status === 'break') {
                actionsHtml = `
                    <button class="btn-t-action btn-t-break" style="background:#fef3c7;" onclick="setBreakStatus()">🔙 結束小休 (轉為空閒)</button>
                    <button class="btn-t-action btn-t-feedback" onclick="openFeedbackModal()">📝 補填意見</button>
                `;
            }
            extraControls.innerHTML = actionsHtml;

            renderTeacherReadonlyList(room);
        }

        function renderTeacherReadonlyList(room) {
            const container = document.getElementById('teacher-readonly-list');
            if (!container) return;

            let html = `<h3 style="margin-top:0; color:#1e293b; text-align:center; border-bottom: 2px solid #f1f5f9; padding-bottom:10px;">📋 本班登記及面見狀況</h3><div class="student-list" style="margin:0; height: 100%; max-height: 500px; overflow-y: auto;">`;
            
            if (!room.schedule || room.schedule.length === 0) {
                html += `<p style="text-align:center; color:#94a3b8; font-weight:bold; margin-top:20px;">尚未建立名單</p>`;
            } else {
                room.schedule.forEach(stu => {
                    let lockedNext = getLockedNextStudentObj(room);
                    let isNextClass = (lockedNext && lockedNext.classNo === stu.classNo) ? 'is-next-inline' : '';
                    html += `
                        <div class="student-row s-${stu.state} ${isNextClass}" style="cursor: default; pointer-events: none;">
                            <span>🕒 ${stu.time} | ${stu.classNo}號 ${stu.name}</span>
                        </div>
                    `;
                });
            }
            html += `</div>`;
            container.innerHTML = html;
        }

        // =======================
        // 查閱家長意見列表
        // =======================
        window.renderFeedbackList = function() {
            const container = document.getElementById('feedback-container');
            if(!container) return;
            container.innerHTML = '';

            if(feedbackData.length === 0) {
                container.innerHTML = `<p style="color:#64748b; font-size:1.2em; grid-column: 1/-1;">目前系統中尚無任何家長意見紀錄。</p>`;
                return;
            }

            feedbackData.forEach(fb => {
                const dateObj = fb.timestamp ? fb.timestamp.toDate() : new Date();
                const timeString = dateObj.toLocaleString('zh-HK', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                // 防止特殊字元破壞字串
                const safeContent = fb.content.replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/'/g, "\\'").replace(/\n/g, '\\n');

                const html = `
                    <div class="feedback-card">
                        <div class="fb-header">
                            <span class="fb-class">${fb.className}</span>
                            <span class="fb-time">🕒 ${timeString}</span>
                        </div>
                        <div class="fb-student">👤 ${fb.classNo}號 ${fb.studentName}</div>
                        <div class="fb-content">${fb.content}</div>
                        <div class="fb-actions">
                            <button class="btn-fb-edit" onclick="editFeedback('${fb.id}', \`${safeContent}\`, '${fb.className}', '${fb.classNo}')">✏️ 編輯</button>
                            <button class="btn-fb-delete" onclick="deleteFeedback('${fb.id}')">🗑️ 刪除</button>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', html);
            });
        }

        function updateTimersUI() {
            document.querySelectorAll('.timer-display').forEach(timerEl => {
                const className = timerEl.getAttribute('data-class');
                const room = systemData[className];
                if (room && room.status === 'busy' && room.startTime) {
                    const elapsedSecs = Math.floor((Date.now() - room.startTime) / 1000);
                    timerEl.innerText = `${String(Math.floor(elapsedSecs / 60)).padStart(2, '0')}:${String(elapsedSecs % 60).padStart(2, '0')}`;
                } else {
                    timerEl.innerText = "00:00";
                }
            });
        }
        setInterval(updateTimersUI, 1000);

    </script>
</head>

            <h2>進入班主任操作面版</h2>
            <select id="select-grade"><option value="1">一年級</option><option value="2">二年級</option><option value="3">三年級</option><option value="4">四年級</option><option value="5">五年級</option></select>
            <select id="select-class"><option value="A">A 班</option><option value="B">B 班</option><option value="C">C 班</option><option value="D">D 班</option><option value="E">E 班</option></select>
            <button class="btn-primary" onclick="enterTeacherPanel()">確認並進入</button>
        </div>
        
        <div id="teacher-panel-view" class="single-teacher-panel">
            <div class="teacher-panel-layout">
                <div class="teacher-left-col">
                    <div id="single-teacher-card"></div>
                    <div id="teacher-extra-controls" class="teacher-actions-container"></div>
                    <div style="text-align:center;">
                        <button class="btn-back" onclick="exitTeacherPanel()">⬅️ 返回重新選擇課室</button>
                    </div>
                </div>
                <div class="teacher-readonly-list teacher-right-col" id="teacher-readonly-list"></div>
            </div>
        </div>
    </div>

    <!-- 視圖四：系統總覽 -->
    <div id="view-master" class="view-section">
        <div class="grid-container" id="master-grid" style="grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));"></div>
    </div>
    
    <!-- 視圖五：查閱家長意見 -->
    <div id="view-feedback-list" class="view-section">
        <div class="setup-card" style="background: transparent; box-shadow: none; padding: 0;">
            <h2 style="margin-top:0; color: #0f172a;">📖 家長意見紀錄總覽</h2>
            <p style="color: #64748b; font-size: 1.1em; margin-bottom: 25px;">此處即時顯示全校老師輸入的家長面見備註（最新鮮的紀錄在最前）。</p>
            <div id="feedback-container" class="grid-container" style="grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));">
            </div>
        </div>
    </div>

    <!-- 視圖六：名單與時間編排 -->
    <div id="view-setup" class="view-section">
        <div class="setup-card">
            <h2 style="margin-top:0;">📝 班級名單與面見時間編輯器</h2>
            <p style="color: #64748b; font-size: 1.1em; margin-bottom: 15px;">你可以直接點擊最左方的「☰」符號並上下拖曳學生以改變排序。</p>
            
            <select id="edit-class-select" style="padding:10px 15px; font-size:1.2em; border-radius:12px; border: 2px solid #cbd5e1; margin-bottom: 15px; width: 100%; max-width: 300px;" onchange="loadScheduleEditor()">
                <script>
                    const grades = [1,2,3,4,5]; const classes = ['A','B','C','D','E'];
                    grades.forEach(g => classes.forEach(c => document.write(`<option value="${g}${c}">${g}${c} 班</option>`)));
                </script>
            </select>

            <div style="display: flex; gap: 10px; margin-bottom: 20px; align-items: center; flex-wrap: wrap;">
                <button class="btn-back" style="background: #f1f5f9;" onclick="sortEditor('classNo')">🔢 按學號重新排序</button>
                <button class="btn-back" style="background: #f1f5f9;" onclick="sortEditor('time')">🕒 按面見時間重新排序</button>
            </div>

            <!-- 自動安排時間面板 -->
            <div class="auto-schedule-box">
                <strong style="color: #0f172a; width: 100%;">🤖 自動排程工具：</strong>
                <label>首位時間: <input type="time" id="auto-start-time" value="09:00" class="auto-input" style="width: 110px;"></label>
                <label>每 <input type="number" id="auto-duration" value="10" class="auto-input"> 分鐘一位</label>
                <label>每面見 <input type="number" id="auto-buffer-count" value="5" class="auto-input"> 位後，</label>
                <label>加入 <input type="number" id="auto-buffer-time" value="15" class="auto-input"> 分鐘小休</label>
                <button class="btn-primary" style="padding: 10px 20px; border-radius: 10px; width: auto; font-size: 1em;" onclick="applyAutoSchedule()">⚡ 執行自動排程</button>
            </div>

            <div id="editor-table-container"></div>
            
            <div style="margin-top: 25px; display: flex; gap: 15px; flex-wrap: wrap;">
                <button class="btn-primary" style="background: #10b981; width: auto; flex-grow: 1;" onclick="addNewStudentRow()">➕ 在表格最底新增一列</button>
                <button class="btn-primary" style="background: #0f172a; width: auto; flex-grow: 2;" onclick="saveClassData()">💾 儲存此班名單至雲端</button>
            </div>
        </div>
    </div>

    <!-- 意見回饋輸入視窗 -->
    <div id="feedback-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>📝 紀錄/編輯家長意見</h3>
            <div style="margin-bottom: 15px; text-align: left;">
                <label style="color: #64748b; font-weight:bold; display:block; margin-bottom:8px;">關聯學生 (預設為當前/最後面見)：</label>
                <select id="feedback-student-select" style="width: 100%; padding: 12px; border-radius: 10px; border: 2px solid #cbd5e1; font-size: 1.1em; outline: none;"></select>
            </div>
            <textarea id="feedback-text" placeholder="請輸入對這位家長的觀察、討論重點或後續跟進事項..."></textarea>
            <div class="modal-btns">
                <button class="btn-back" style="padding:10px 20px; border-radius:10px;" onclick="closeFeedbackModal()">取消</button>
                <button class="btn-primary" style="width:auto; padding:10px 25px; border-radius:10px;" onclick="submitFeedback()">📤 儲存</button>
            </div>
        </div>
    </div>

</body>
</html>
